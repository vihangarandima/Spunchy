<html lang="en">
<head>

<title>All crumbs · Spunchy</title>
<link rel="icon" type="image/png" href="/favicon.png" />
<style>

  a { display: inline-block; margin-top: 1.5rem; background: #C8401C; color: #fff; padding: .85rem 1.5rem; border-radius: 999px; text-decoration: none; font-weight: 600; }

</style>
</head>

  <main>
    <img src="/img/logo-sign.webp" width="600" height="223" alt="Spunchy" />
